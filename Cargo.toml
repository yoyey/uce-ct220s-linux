[package]
name = "ct220s_viewer"
version = "0.2.0"
edition = "2021"

[features]
default = []
# Alerte sonore conforme / échec : cargo run --features son
son = ["dep:rodio"]

[dependencies]
eframe = "0.24"
egui = "0.24"
hidapi = "2.4"
byteorder = "1.5"
clap = { version = "4.4", features = ["derive"] }
image = "0.24"
miniz_oxide = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rodio = { version = "0.17", optional = true, default-features = false }
